[package]
name = "wireguard-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native Win32 Graphical User Interface for WireGuard Windows (100% Rust)"

[dependencies]
wireguard-types = { path = "../wireguard-types" }
wireguard-conf = { path = "../wireguard-conf" }
wireguard-service = { path = "../wireguard-service" }
wireguard-ringlog = { path = "../wireguard-ringlog" }
wireguard-version = { path = "../wireguard-version" }
wireguard-manager = { path = "../wireguard-manager" }
wireguard-elevate = { path = "../wireguard-elevate" }
wireguard-dpapi = { path = "../wireguard-dpapi" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Services",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
thiserror = { workspace = true }
tracing = { workspace = true }
